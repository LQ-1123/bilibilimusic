{% if error %}
<div class="empty">B 站搜索失败：{{ error }}</div>
{% elif not ups and not results %}
<div class="empty">没有找到「{{ q }}」相关的 UP 主或音乐。</div>
{% else %}
{% if ups %}
<div class="sec">
  <div class="sec-head"><h2>UP 主</h2></div>
  <div class="sr-ups">
    {% for u in ups %}
    <button type="button" class="sr-up" data-mid="{{ u.mid }}" data-name="{{ u.name }}" title="{{ u.sign }}">
      <span class="ava"><img src="{{ u.face }}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>
      <span class="n">{{ u.name }}</span>
      <span class="f">{{ u.fans_text }} 粉丝</span>
    </button>
    {% endfor %}
  </div>
</div>
{% endif %}
{% if results %}
<div class="sec">
  <div class="sec-head"><h2>歌曲</h2></div>
  <div class="sr-grid">
    {% for r in results %}
    <div class="sr-song" data-bvid="{{ r.bvid }}" data-artist="{{ r.artist }}" onclick="playRecRow(this)" title="{{ r.title }}">
      <span class="im"><img src="{{ r.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>
      <span class="t1">{{ r.title }}</span>
      <span class="t2">{{ r.artist }}</span>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
{% endif %}
