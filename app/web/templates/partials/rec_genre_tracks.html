{% if items %}
<div class="tracklist">
  {% for r in items %}
  <div class="trk trk-rec" data-bvid="{{ r.bvid }}" onclick="playRecRow(this)" title="{{ r.title }}">
    <span class="no">{{ loop.index }}</span>
    <span class="eqbox"><span class="eq"><i></i><i></i><i></i></span></span>
    <span class="im"><img src="{{ r.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>
    <div class="tt">
      <div class="t1">{{ r.title }}</div>
      <div class="t2">{{ r.artist }}</div>
    </div>
    <span class="pl-pill">{{ r.genre }}</span>
    <span class="q dim">REC</span>
    <span class="du">{{ r.duration_text }}</span>
  </div>
  {% endfor %}
</div>
{% else %}
{% if genre == "daily" %}
<div class="empty">今日推荐还没生成——去听几首歌，推荐会慢慢懂你。</div>
{% else %}
<div class="empty">这个风格暂时没有推荐——去听几首歌，推荐会慢慢懂你。</div>
{% endif %}
{% endif %}
