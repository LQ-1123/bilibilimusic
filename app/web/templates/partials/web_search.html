{% if error %}
<div class="sd-empty">B 站搜索失败：{{ error }}</div>
{% elif results %}
<div class="sd-sec">B 站 · 点击试听</div>
{% for r in results %}
<div class="sd-row" data-bvid="{{ r.bvid }}">
  <img class="sd-cov" src="{{ r.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer">
  <div class="sd-meta">
    <div class="sd-t" title="{{ r.title }}">{{ r.title }}</div>
    <div class="sd-s">{{ r.artist }} · {{ r.duration_text }} · {{ r.play_text }}播放</div>
  </div>
</div>
{% endfor %}
{% endif %}
