{% for c in cards %}
<button type="button" class="side-pl" data-pl="{{ c.id }}" data-name="{{ c.name }}"
        data-count="{{ c.count }}" data-hue="{{ c.hue }}" style="--h:{{ c.hue }}"
        onclick="openDetailFrom(this)" title="打开歌单「{{ c.name }}」">
  <span class="sp-cov">{% if c.cover %}<img src="{{ c.cover }}" alt="" loading="lazy" referrerpolicy="no-referrer">{% else %}♪{% endif %}</span>
  <span class="sp-name">{{ c.name }}</span>
  {% if c.id != 0 %}
  <span class="cnt">{{ c.count }}</span>
  <span class="pl-rename" title="重命名（B 站收藏夹同步改名）"
        onclick="event.stopPropagation(); renamePlaylist({{ c.id }}, this.closest('.side-pl').dataset.name)">✎</span>
  <span class="pl-del" title="删除歌单（歌曲移入我的曲库，B 站收藏夹一并删除）"
        onclick="event.stopPropagation(); deletePlaylist({{ c.id }}, this.closest('.side-pl').dataset.name)">✕</span>
  {% endif %}
</button>
{% endfor %}
