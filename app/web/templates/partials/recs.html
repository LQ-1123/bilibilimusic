<div class="rec-genres">
  <button type="button" class="pl-chip {{ 'on' if mode == 'today' }}" hx-get="/partials/recs?mode=today" hx-target="#rec-list" hx-swap="innerHTML">今日推荐</button>
  <button type="button" class="pl-chip {{ 'on' if not mode and not genre }}" hx-get="/partials/recs" hx-target="#rec-list" hx-swap="innerHTML">全部</button>
  {% for g in genres %}
  <button type="button" class="pl-chip {{ 'on' if genre == g }}" hx-get="/partials/recs?genre={{ g }}" hx-target="#rec-list" hx-swap="innerHTML">{{ g }}</button>
  {% endfor %}
</div>

{% if items %}
<div class="rec-grid">
  {% for r in items %}
  <div class="reccard" title="{{ r.title }}">
    <div class="rc">
      <div class="im">
        <img src="{{ r.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer">
        <span class="gtag">{{ r.genre }}</span>
      </div>
      <div class="nm">{{ r.title }}</div>
      <div class="ar">{{ r.artist }} · {{ r.duration_text }}</div>
      <div class="acts">
        <button type="button" class="mini-act rec-play" data-bvid="{{ r.bvid }}" title="实时流试听（不下载）"
                onclick="playRec('{{ r.bvid }}', this)">▶</button>
        <button type="button" class="mini-act love rec-collect" data-bvid="{{ r.bvid }}" title="收藏入库（自动同步 B 站夹）"
                hx-post="/web/import"
                hx-vals='{"url": "https://www.bilibili.com/video/{{ r.bvid }}"}'
                hx-include="#collect-playlist-id"
                hx-target="#task-list" hx-swap="innerHTML">♥</button>
        <button type="button" class="mini-act" title="不感兴趣（移出推荐池）"
                onclick="dismissRec('{{ r.bvid }}', this)">✕</button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty">推荐池还空着——去听几首歌，推荐会慢慢懂你。</div>
{% endif %}
