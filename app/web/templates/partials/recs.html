<div class="rec-genres">
  <button type="button" class="pl-chip {{ 'on' if mode == 'today' }}" hx-get="/partials/recs?mode=today" hx-target="#rec-list" hx-swap="innerHTML">今日推荐</button>
  <button type="button" class="pl-chip {{ 'on' if not mode and not genre }}" hx-get="/partials/recs" hx-target="#rec-list" hx-swap="innerHTML">全部</button>
  {% for g in genres %}
  <button type="button" class="pl-chip {{ 'on' if genre == g }}" hx-get="/partials/recs?genre={{ g }}" hx-target="#rec-list" hx-swap="innerHTML">{{ g }}</button>
  {% endfor %}
</div>

{% if items %}
<div class="rec-grid">
  {% for r in items %}
  <div class="reccard" title="{{ r.title }}" data-bvid="{{ r.bvid }}" onclick="playRecRow(this)">
    <div class="rc">
      <div class="im">
        <img src="{{ r.cover_url }}" alt="" loading="lazy" referrerpolicy="no-referrer">
        <span class="gtag">{{ r.genre }}</span>
      </div>
      <div class="nm">{{ r.title }}</div>
      <div class="ar">{{ r.artist }}</div>
      <div class="acts">
        <button type="button" class="mini-act addto" data-rec="{{ r.bvid }}"
                data-url="https://www.bilibili.com/video/{{ r.bvid }}"
                title="加入指定歌单（B 站夹同步）">＋</button>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty">推荐池还空着——去听几首歌，推荐会慢慢懂你。</div>
{% endif %}
