<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliMusic · B站音乐收藏</title>
  <meta name="theme-color" content="#fb7299">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=11">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/transition.js?v=7" defer></script>
  <script src="/static/app.js?v=12" defer></script>
  <script src="/static/export.js?v=7" defer></script>
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="logo">▶<b>BiliMusic</b></div>

    <div class="side-search">
      <input id="search" type="search" name="q" placeholder="搜索歌名 / UP 主…" autocomplete="off"
             hx-get="/partials/songs" hx-trigger="input changed delay:300ms"
             hx-include="this, #collect-playlist-id" hx-target="#songs" hx-swap="innerHTML">
    </div>

    <nav class="side-nav">
      <button type="button" class="side-item on" data-view="home" onclick="switchView('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>主页
      </button>
      <button type="button" class="side-item" data-view="discover" onclick="switchView('discover')">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>发现
      </button>
    </nav>

    <div class="side-sec">我的歌单</div>
    <nav class="side-playlists" id="playlists-bar"
         hx-get="/partials/playlists" hx-trigger="load, playlistsChanged from:body" hx-swap="innerHTML"></nav>
    <button type="button" class="side-item add" onclick="createPlaylist()">＋ 新建歌单</button>

    <div class="side-bottom">
      <button id="btn-sync" class="side-action" hx-post="/web/sync" hx-target="#task-list"
              hx-swap="innerHTML" title="与 B 站「bilimusic」收藏夹双向对账">⇅ 同步</button>
      <button id="btn-export" class="side-action" title="把歌单导出为 B 站收藏夹链接">⤴ 导出</button>
      <a class="side-action" href="/login">◎ 账号</a>
      <span id="auth-badge" class="badge {{ 'ok' if logged_in else 'err' }}">
        {% if logged_in %}已登录 · 最高 192K{% else %}未登录{% endif %}
      </span>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<footer id="player-bar">
  <div class="p-meta">
    <img id="player-cover" alt="封面">
    <div class="pm-text">
      <div id="player-title">—</div>
      <div id="player-artist"></div>
    </div>
  </div>
  <div class="p-controls">
    <button id="btn-prev" title="上一首">⏮</button>
    <button id="btn-toggle" title="播放/暂停">▶</button>
    <button id="btn-next" title="下一首">⏭</button>
  </div>
  <div class="p-progress">
    <span id="t-cur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <span id="t-dur">0:00</span>
  </div>
  <button id="btn-lyrics" title="歌词">词</button>
  <button id="btn-queue" title="播放列表">☰</button>
  <audio id="audio" preload="none"></audio>
  <audio id="audio2" preload="none"></audio>
</footer>

<div id="lyrics-panel" class="hidden">
  <div class="l-head">
    <div class="l-song">
      <b id="lyrics-title">—</b>
      <span id="lyrics-artist"></span>
    </div>
    <button id="btn-lyrics-close" title="收起歌词">✕</button>
  </div>
  <div id="lyrics-scroll"></div>
</div>

<div id="queue-panel" class="hidden">
  <div class="q-head">
    <span>播放列表 <span id="queue-count"></span></span>
    <span class="q-toggles">
      <label class="smart-toggle" title="切歌时自动寻找最佳衔接点">
        <input type="checkbox" id="smart-toggle"> 智能过渡
      </label>
      <label class="smart-toggle" title="当前歌曲循环播放">
        <input type="checkbox" id="repeat-one-toggle"> 单曲循环
      </label>
    </span>
  </div>
  <ul id="queue-list"></ul>
</div>

<div id="export-modal" class="modal hidden">
  <div class="modal-box">
    <h3>导出为 B 站收藏夹</h3>
    <p class="hint">
      每次收藏都会自动同步进你账号的公开收藏夹「<b>bilimusic</b>」。
      此按钮补同步缺失的歌曲（登录前收藏或收藏失败的），随后生成分享链接——
      他人把链接粘进本应用即可整夹收藏，链接对浏览器 / B 站 App 同样有效。
    </p>
    <div id="export-progress" class="hidden">
      <div class="bar"><div class="fill" id="export-fill" style="width: 0%"></div></div>
      <span id="export-status">准备中…</span>
    </div>
    <div id="export-result" class="hidden">
      <a id="export-link" target="_blank" rel="noopener"></a>
      <button id="btn-copy-link">复制链接</button>
    </div>
    <div id="export-failures" class="hidden"></div>
    <div class="modal-actions">
      <button id="btn-export-close">关闭</button>
      <button id="btn-export-start">生成链接 / 补同步</button>
    </div>
  </div>
</div>
</body>
</html>
