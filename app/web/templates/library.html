{% extends "base.html" %}
{% block content %}

<section class="view" id="view-home">

  <!-- 空 hero：纯氛围渐变载体（无文字内容） -->
  <div class="hero sec-hero" aria-hidden="true"></div>

  <div class="sec sec-recpl">
    <div class="sec-head"><h2>推荐歌单</h2></div>
    <div class="rack" id="recpl-rack"
         hx-get="/partials/rec-playlists" hx-trigger="load, refreshSongs from:body" hx-swap="innerHTML"></div>
  </div>

  <div class="sec sec-recent">
    <div class="sec-head"><h2>最近收藏</h2></div>
    <div class="rack" id="recent-rack"
         hx-get="/partials/recent" hx-trigger="load, refreshSongs from:body" hx-swap="innerHTML"></div>
  </div>

  <!-- 最近播放：本机播放记录（localStorage），无记录时整栏隐藏 -->
  <div class="sec sec-history" id="sec-history" hidden>
    <div class="sec-head"><h2>最近播放</h2><span class="hint">本机记录</span></div>
    <div class="rack" id="history-rack"></div>
  </div>

  <!-- 流派货架：每个风格一栏，池子优先+搜索补位到 15 首；采集/收藏后 recsChanged 刷新 -->
  <div id="genre-shelves" hx-get="/partials/genre-shelves" hx-trigger="load, recsChanged from:body" hx-swap="innerHTML"></div>

  <div style="height:26px"></div>
</section>

<section class="view" id="view-detail">
  <div class="dt-top">
    <button class="tb-cir" type="button" onclick="goHome()" title="返回主页">‹</button>
    <div style="font-size:13px;color:var(--txt2);font-weight:600" id="dt-crumb">主页 / 我的曲库</div>
  </div>
  <div class="dt-hero" id="dt-hero">
    <div class="dt-cvr"></div>
    <div class="dt-info">
      <div class="dt-eyebrow" id="dt-eyebrow">歌单</div>
      <div class="dt-title" id="dt-title">我的曲库</div>
      <div class="dt-meta" id="dt-meta"></div>
      <div class="dt-acts">
        <button class="btn-play" type="button" onclick="playDetailFirst()">播放</button>
        <button class="btn-share" type="button" onclick="shareDetail()" title="分享该歌单（B 站收藏夹链接）">↗ 分享</button>
      </div>
    </div>
  </div>
  <div class="list-head">
    <span style="text-align:center">#</span><span></span><span>标题</span><span>歌单</span><span>音质</span><span class="r">时长</span><span></span>
  </div>
  <div id="dt-songs"></div>
  <div style="height:26px"></div>
</section>

<section class="view" id="view-account">
  <div class="acct-card">
    {% if user.face %}
    <img class="ava" src="{{ user.face }}" alt="" referrerpolicy="no-referrer">
    {% else %}
    <div class="ava">♪</div>
    {% endif %}
    <div style="min-width:0">
      <div class="n">{{ user.uname }}</div>
      <div class="s">已登录 · 音质最高 192K</div>
    </div>
  </div>
  <div class="acct-rows">
    <button class="acct-row" type="button" onclick="syncNow()"><span>⇅</span>同步 B 站收藏夹<span class="sub">曲库事实源在 B 站</span></button>
    <button class="acct-row" type="button" onclick="document.getElementById('btn-export').click()"><span>⤴</span>导出歌单链接<span class="sub">bilimusic 夹</span></button>
    <button class="acct-row" type="button" onclick="toggleTheme()"><span>◐</span>外观 · 亮 / 暗<span class="sub" id="theme-mode-sub">跟随本机</span></button>
  </div>
  <div style="text-align:center;font-size:10.5px;color:var(--txt3);margin-top:26px">BiliMusic · 曲库事实源在 B 站侧</div>
</section>

<form class="collect-box" hidden hx-post="/web/import" hx-target="#task-list" hx-swap="innerHTML">
  <input type="hidden" name="playlist_id" id="collect-playlist-id" value="0">
  <input type="text" name="url" placeholder="粘贴 B 站视频链接收藏">
</form>
{% endblock %}
