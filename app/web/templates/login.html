{% extends "base.html" %}
{% block bodyclass %}class="login-mode"{% endblock %}
{% block content %}
<section class="login-box">
  <div class="lb-brand">BILI MUSIC</div>
  <h2>扫码登录 B 站</h2>
  <p class="hint">用 B 站 App 扫码，登录后开始收藏与播放。凭据仅保存在本机后端。</p>
  <div id="qr-box">
    <div id="qr-status">正在生成二维码…</div>
    <img id="qr-img" alt="登录二维码" hidden>
    <button id="qr-refresh" class="hidden">二维码已失效，点击刷新</button>
  </div>
  {% if logged_in %}
  <div class="current-login">
    当前已登录。
    <button id="btn-logout">退出登录</button>
  </div>
  {% endif %}
</section>
{% endblock %}
