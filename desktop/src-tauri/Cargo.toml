[package]
name = "bilimusic"
version = "1.1.0"
description = "BiliMusic desktop player"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
